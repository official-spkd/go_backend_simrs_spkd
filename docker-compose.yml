# Deployment of the API only: PostgreSQL and MinIO run outside Docker, on the host.
#   docker compose up -d --build
# The container shares the host network, so the localhost addresses in .env (DB_HOST, MINIO_ENDPOINT)
# work unchanged. This needs Docker on Linux.
name: simrs-v2

services:
  simrs-api:
    build: .
    image: simrs-v2-api:latest
    container_name: simrs-v2-api
    restart: unless-stopped
    network_mode: host
    env_file: .env
