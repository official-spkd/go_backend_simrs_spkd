basePath: /
definitions:
  auth.LoginRequest:
    properties:
      identifier:
        description: NIP or email
        example: "198001012010011001"
        type: string
      password:
        example: s3cretPass!
        type: string
    required:
    - identifier
    - password
    type: object
  auth.LoginResponse:
    properties:
      access_token:
        type: string
      expires_in:
        description: seconds
        example: 28800
        type: integer
      token_type:
        example: Bearer
        type: string
      user:
        $ref: '#/definitions/auth.UserResponse'
    type: object
  auth.RegisterRequest:
    properties:
      email:
        example: jane.doe@hospital.id
        maxLength: 150
        type: string
      name:
        example: Dr. Jane Doe
        maxLength: 150
        type: string
      nip:
        example: "198001012010011001"
        maxLength: 30
        type: string
      password:
        example: s3cretPass!
        maxLength: 72
        minLength: 8
        type: string
      role:
        example: doctor
        type: string
    required:
    - email
    - name
    - nip
    - password
    type: object
  auth.UserResponse:
    properties:
      created_at:
        type: string
      email:
        example: jane.doe@hospital.id
        type: string
      id:
        example: 3f2b8c1e-5d4a-4e7b-9a1c-2b6f0d8e4a71
        type: string
      is_active:
        example: true
        type: boolean
      name:
        example: Dr. Jane Doe
        type: string
      nip:
        example: "198001012010011001"
        type: string
      role:
        example: doctor
        type: string
    type: object
  models.Gender:
    enum:
    - Male
    - Female
    type: string
    x-enum-varnames:
    - GenderMale
    - GenderFemale
  models.Payer:
    enum:
    - General
    - BPJS
    - Insurance
    type: string
    x-enum-varnames:
    - PayerGeneral
    - PayerBPJS
    - PayerInsurance
  patients.PatientRequest:
    properties:
      allergies:
        example: Penicillin, peanuts
        maxLength: 1000
        type: string
      birth_date:
        example: "1990-05-17"
        type: string
      birth_place:
        example: Jakarta
        maxLength: 100
        type: string
      blood_type:
        enum:
        - A
        - B
        - AB
        - O
        example: O
        type: string
      domicile_address:
        example: Jl. Mawar No. 9, Depok
        maxLength: 500
        minLength: 5
        type: string
      education:
        example: Bachelor
        maxLength: 50
        type: string
      email:
        example: siti@example.com
        maxLength: 150
        type: string
      emergency_contact_name:
        example: Budi Santoso
        maxLength: 150
        minLength: 3
        type: string
      emergency_contact_phone:
        example: "081298765432"
        type: string
      emergency_contact_relationship:
        example: Husband
        maxLength: 50
        type: string
      full_name:
        example: Siti Rahmawati
        maxLength: 150
        minLength: 3
        type: string
      gender:
        allOf:
        - $ref: '#/definitions/models.Gender'
        enum:
        - Male
        - Female
        example: Female
      id_card_address:
        example: Jl. Melati No. 5, Jakarta Selatan
        maxLength: 500
        minLength: 5
        type: string
      marital_status:
        enum:
        - Single
        - Married
        - Divorced
        - Widowed
        example: Married
        type: string
      nik:
        example: "3171234567890001"
        type: string
      occupation:
        example: Teacher
        maxLength: 100
        type: string
      payer:
        allOf:
        - $ref: '#/definitions/models.Payer'
        enum:
        - General
        - BPJS
        - Insurance
        example: BPJS
      phone:
        example: "081234567890"
        type: string
      religion:
        example: Islam
        maxLength: 50
        type: string
    required:
    - birth_date
    - birth_place
    - emergency_contact_name
    - emergency_contact_phone
    - emergency_contact_relationship
    - full_name
    - gender
    - id_card_address
    - nik
    - payer
    - phone
    type: object
  patients.Response:
    properties:
      allergies:
        example: Penicillin, peanuts
        type: string
      birth_date:
        example: "1990-05-17"
        type: string
      birth_place:
        example: Jakarta
        type: string
      blood_type:
        example: O
        type: string
      created_at:
        type: string
      domicile_address:
        example: Jl. Mawar No. 9, Depok
        type: string
      education:
        example: Bachelor
        type: string
      email:
        example: siti@example.com
        type: string
      emergency_contact_name:
        example: Budi Santoso
        type: string
      emergency_contact_phone:
        example: "081298765432"
        type: string
      emergency_contact_relationship:
        example: Husband
        type: string
      full_name:
        example: Siti Rahmawati
        type: string
      gender:
        allOf:
        - $ref: '#/definitions/models.Gender'
        enum:
        - Male
        - Female
        example: Female
      id:
        example: 3f2b8c1e-5d4a-4e7b-9a1c-2b6f0d8e4a71
        type: string
      id_card_address:
        example: Jl. Melati No. 5, Jakarta Selatan
        type: string
      marital_status:
        example: Married
        type: string
      nik:
        example: "3171234567890001"
        type: string
      occupation:
        example: Teacher
        type: string
      payer:
        allOf:
        - $ref: '#/definitions/models.Payer'
        enum:
        - General
        - BPJS
        - Insurance
        example: BPJS
      phone:
        example: "081234567890"
        type: string
      religion:
        example: Islam
        type: string
      updated_at:
        type: string
    type: object
  roles.CreateRequest:
    properties:
      description:
        example: Ward nurse
        maxLength: 255
        type: string
      display_name:
        example: Nurse
        maxLength: 100
        type: string
      name:
        example: nurse
        maxLength: 50
        minLength: 2
        type: string
    required:
    - display_name
    - name
    type: object
  roles.Role:
    properties:
      created_at:
        type: string
      description:
        example: Medical doctor
        type: string
      display_name:
        example: Doctor
        type: string
      id:
        example: 3f2b8c1e-5d4a-4e7b-9a1c-2b6f0d8e4a71
        format: uuid
        type: string
      is_system:
        description: built-in roles cannot be deleted
        example: true
        type: boolean
      name:
        example: doctor
        type: string
      updated_at:
        type: string
    type: object
  roles.UpdateRequest:
    properties:
      description:
        example: Ward head nurse
        maxLength: 255
        type: string
      display_name:
        example: Head Nurse
        maxLength: 100
        type: string
    required:
    - display_name
    type: object
  users.ResetPasswordRequest:
    properties:
      new_password:
        example: n3wS3cretPass!
        maxLength: 72
        minLength: 8
        type: string
    required:
    - new_password
    type: object
  users.Response:
    properties:
      created_at:
        type: string
      email:
        example: jane.doe@hospital.id
        type: string
      id:
        example: 3f2b8c1e-5d4a-4e7b-9a1c-2b6f0d8e4a71
        type: string
      is_active:
        example: true
        type: boolean
      name:
        example: Dr. Jane Doe
        type: string
      nip:
        example: "198001012010011001"
        type: string
      role:
        example: doctor
        type: string
      updated_at:
        type: string
    type: object
  users.UpdateRequest:
    properties:
      email:
        example: jane.doe@hospital.id
        maxLength: 150
        type: string
      name:
        example: Dr. Jane Doe
        maxLength: 150
        type: string
      nip:
        example: "198001012010011001"
        maxLength: 30
        type: string
    required:
    - email
    - name
    - nip
    type: object
  users.UpdateRoleRequest:
    properties:
      role:
        example: pharmacist
        type: string
    required:
    - role
    type: object
  users.UpdateStatusRequest:
    properties:
      is_active:
        example: false
        type: boolean
    required:
    - is_active
    type: object
  utils.ErrorResponse:
    properties:
      data: {}
      message:
        example: something went wrong
        type: string
      success:
        example: false
        type: boolean
    type: object
  utils.PaginatedResponse:
    properties:
      data: {}
      message:
        example: Items retrieved successfully
        type: string
      pagination:
        $ref: '#/definitions/utils.Pagination'
      success:
        example: true
        type: boolean
    type: object
  utils.Pagination:
    properties:
      current_page:
        example: 1
        type: integer
      has_next_page:
        example: true
        type: boolean
      has_prev_page:
        example: false
        type: boolean
      items_per_page:
        example: 20
        type: integer
      next_page:
        example: 2
        type: integer
      prev_page:
        example: 1
        type: integer
      total_items:
        example: 42
        type: integer
      total_pages:
        example: 3
        type: integer
    type: object
  utils.Response:
    properties:
      data: {}
      message:
        example: Operation completed successfully
        type: string
      success:
        example: true
        type: boolean
    type: object
info:
  contact: {}
  description: API documentation for SIMRS.
  title: SIMRS API
  version: "1.0"
paths:
  /api/v1/auth/login:
    post:
      consumes:
      - application/json
      parameters:
      - description: Credentials
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/utils.Response'
            - properties:
                data:
                  $ref: '#/definitions/auth.LoginResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
      summary: Sign in with NIP or email
      tags:
      - auth
  /api/v1/auth/me:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/utils.Response'
            - properties:
                data:
                  $ref: '#/definitions/auth.UserResponse'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get the signed-in user
      tags:
      - auth
  /api/v1/auth/register:
    post:
      consumes:
      - application/json
      description: Open for the very first account (becomes superadmin). Afterwards
        only a superadmin can register accounts.
      parameters:
      - description: User data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/utils.Response'
            - properties:
                data:
                  $ref: '#/definitions/auth.UserResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Register a user
      tags:
      - auth
  /api/v1/patients:
    get:
      description: Front Office only. Search by name, NIK or phone; filter by gender
        and payer.
      parameters:
      - description: Search by name, NIK or phone
        in: query
        name: search
        type: string
      - description: Filter by gender
        enum:
        - Male
        - Female
        in: query
        name: gender
        type: string
      - description: Filter by payer
        enum:
        - General
        - BPJS
        - Insurance
        in: query
        name: payer
        type: string
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 20
        description: Items per page (max 100)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/utils.PaginatedResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/patients.Response'
                  type: array
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List patients
      tags:
      - patients
    post:
      consumes:
      - application/json
      description: Front Office only. NIK must be unique and exactly 16 digits.
      parameters:
      - description: Patient data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/patients.PatientRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/utils.Response'
            - properties:
                data:
                  $ref: '#/definitions/patients.Response'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Register a patient
      tags:
      - patients
  /api/v1/patients/{id}:
    delete:
      description: Front Office only. The record is soft-deleted and its NIK can be
        registered again.
      parameters:
      - description: Patient ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete a patient
      tags:
      - patients
    get:
      description: Front Office only.
      parameters:
      - description: Patient ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/utils.Response'
            - properties:
                data:
                  $ref: '#/definitions/patients.Response'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get a patient
      tags:
      - patients
    put:
      consumes:
      - application/json
      description: Front Office only. Replaces all editable fields.
      parameters:
      - description: Patient ID
        in: path
        name: id
        required: true
        type: string
      - description: Patient data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/patients.PatientRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/utils.Response'
            - properties:
                data:
                  $ref: '#/definitions/patients.Response'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update a patient
      tags:
      - patients
  /api/v1/roles:
    get:
      description: Superadmin only.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/utils.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/roles.Role'
                  type: array
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List roles
      tags:
      - roles
    post:
      consumes:
      - application/json
      description: Superadmin only.
      parameters:
      - description: Role data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/roles.CreateRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/utils.Response'
            - properties:
                data:
                  $ref: '#/definitions/roles.Role'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create a role
      tags:
      - roles
  /api/v1/roles/{id}:
    delete:
      description: Superadmin only.
      parameters:
      - description: Role ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete a role
      tags:
      - roles
    get:
      description: Superadmin only.
      parameters:
      - description: Role ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/utils.Response'
            - properties:
                data:
                  $ref: '#/definitions/roles.Role'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get a role
      tags:
      - roles
    put:
      consumes:
      - application/json
      description: Superadmin only.
      parameters:
      - description: Role ID
        in: path
        name: id
        required: true
        type: string
      - description: Role data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/roles.UpdateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/utils.Response'
            - properties:
                data:
                  $ref: '#/definitions/roles.Role'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update a role's display name and description
      tags:
      - roles
  /api/v1/users:
    get:
      description: Superadmin only. Supports search by name, NIP or email, and filters
        by role and status.
      parameters:
      - description: Search by name, NIP or email
        in: query
        name: search
        type: string
      - description: Filter by role name
        in: query
        name: role
        type: string
      - description: Filter by status
        in: query
        name: is_active
        type: boolean
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 20
        description: Items per page (max 100)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/utils.PaginatedResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/users.Response'
                  type: array
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List users
      tags:
      - users
  /api/v1/users/{id}:
    delete:
      description: Superadmin only. You cannot delete your own account.
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.Response'
