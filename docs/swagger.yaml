info:
  contact: {}
  description: API documentation for SIMRS.
  title: SIMRS API
  version: "1.0"
paths:
  /api/v1/apm/doctors:
    get:
      description: Public (no login). Active doctors of active polis, optionally of
        one poli. No license or account data is exposed.
      parameters:
      - description: Only doctors of this poli
        in: query
        name: poli_id
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/utils.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/apm.DoctorBrief'
                  type: array
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
      summary: 'APM: list doctors'
      tags:
      - apm
  /api/v1/apm/patients:
    post:
      consumes:
      - application/json
      description: 'Public (no login). Creates a patient record with the same fields
        and validation as the front desk (NIK must be a valid, unused 16-digit number;
        bpjs_number optional). Returns the brief patient (id and No. RM) to pass to
        POST /apm/visits. An existing NIK or BPJS number is refused with 409: that
        person is a returning patient and should be looked up instead. Strictly rate
        limited per IP (5 per minute).'
      parameters:
      - description: Patient data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/patients.PatientRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/utils.Response'
            - properties:
                data:
                  $ref: '#/definitions/apm.PatientBrief'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
      summary: 'APM: register a new patient'
      tags:
      - apm
  /api/v1/apm/patients/lookup:
    get:
      description: Public (no login), for the self-service registration kiosk (APM).
        Send exactly one of nik, medical_record_number (RM-000001) or bpjs_number.
        Returns only what the kiosk needs to confirm the person (no NIK, contact,
        address or allergies). Strictly rate limited per IP (10 per minute).
      parameters:
      - description: 16-digit NIK
        in: query
        name: nik
        type: string
      - description: Medical record number, e.g. RM-000001
        in: query
        name: medical_record_number
        type: string
      - description: 13-digit BPJS card number
        in: query
        name: bpjs_number
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/utils.Response'
            - properties:
                data:
                  $ref: '#/definitions/apm.PatientBrief'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
      summary: 'APM: find a returning patient'
      tags:
      - apm
  /api/v1/apm/polis:
    get:
      description: Public (no login). Active polis only, with only the fields a kiosk
        shows.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/utils.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/apm.PoliBrief'
                  type: array
              type: object
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
      summary: 'APM: list polis'
      tags:
      - apm
  /api/v1/apm/sessions:
    get:
      description: Public (no login). Today's practice hours and remaining quota of
        the doctors with a weekly schedule, optionally of one poli. A doctor on leave
        has status "leave"; a doctor without a session today is absent. Only today
        can be asked. Rate limited per IP.
      parameters:
      - description: Only doctors of this poli
        in: query
        name: poli_id
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/utils.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/apm.SessionBrief'
                  type: array
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
      summary: 'APM: list today''s sessions'
      tags:
      - apm
  /api/v1/apm/visits:
    post:
      consumes:
      - application/json
      description: Public (no login). Registers a patient (patient_id from the lookup,
        or from POST /apm/patients for a new patient) for a visit today with an active
        doctor of the chosen poli, following the same rules as the front desk (BPJS
        and insurance fields, responsible person under 18, no double registration).
        The kiosk cannot pick another date or approve the visit. Returns the ticket
        to print. Rate limited per IP (60 per minute).
      parameters:
      - description: Registration
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/apm.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/utils.Response'
            - properties:
                data:
                  $ref: '#/definitions/apm.Ticket'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
      summary: 'APM: register a visit'
      tags:
