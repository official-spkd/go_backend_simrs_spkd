basePath: /
definitions:
  apm.DoctorBrief:
    properties:
      id:
        example: 9d1f6c2a-7b3e-4a58-8c1d-0e5f4b2a6d93
        type: string
      name:
        example: dr. Andi Wijaya, Sp.PD
        type: string
      poli:
        $ref: '#/definitions/apm.PoliBrief'
      specialization:
        example: Internal Medicine
        type: string
    type: object
  apm.PatientBrief:
    properties:
      birth_date:
        example: "1990-05-17"
        type: string
      bpjs_number:
        example: "0001234567890"
        type: string
      full_name:
        example: Siti Rahmawati
        type: string
      gender:
        allOf:
        - $ref: '#/definitions/models.Gender'
        enum:
        - Male
        - Female
        example: Female
      id:
        example: 3f2b8c1e-5d4a-4e7b-9a1c-2b6f0d8e4a71
        type: string
      medical_record_number:
        example: RM-000001
        type: string
      payer:
        allOf:
        - $ref: '#/definitions/models.Payer'
        enum:
        - General
        - BPJS
        - Insurance
        example: BPJS
    type: object
  apm.PoliBrief:
    properties:
      id:
        example: 7a1c2b6f-0d8e-4a71-9a1c-3f2b8c1e5d4a
        type: string
      name:
        example: General Clinic
        type: string
      prefix_code:
        example: UMUM
        type: string
      room:
        example: Room 101
        type: string
    type: object
  apm.RegisterRequest:
    properties:
      bpjs_card_number:
        description: 'BPJS only: required when penjamin is bpjs, rejected otherwise.'
        example: "0001234567890"
        type: string
      chief_complaint:
        example: Fever and cough
        maxLength: 1000
        type: string
      control_letter_number:
        example: 0123R0010125K000001
        maxLength: 50
        type: string
      coverage_limit:
        example: 15000000
        minimum: 0
        type: integer
      doctor_id:
        example: 9d1f6c2a-7b3e-4a58-8c1d-0e5f4b2a6d93
        type: string
      document_type:
        example: Referral letter
        maxLength: 50
        type: string
      fktp_referral_number:
        example: 0123R0010125Y000001
        maxLength: 50
        type: string
      insurance_name:
        description: 'Asuransi only: insurance_name and policy_number are required
          when penjamin is asuransi.'
        example: Prudential
        maxLength: 150
        type: string
      patient_id:
        example: 3f2b8c1e-5d4a-4e7b-9a1c-2b6f0d8e4a71
        type: string
      penjamin:
        allOf:
        - $ref: '#/definitions/models.Penjamin'
        enum:
        - umum
        - bpjs
        - asuransi
        example: bpjs
      poli_id:
        example: 7a1c2b6f-0d8e-4a71-9a1c-3f2b8c1e5d4a
        type: string
      policy_number:
        example: POL-2026-001234
        maxLength: 50
        type: string
      responsible_person:
        description: required for patients under 18
        example: Budi Santoso
        maxLength: 150
        minLength: 3
        type: string
      visit_type:
        allOf:
        - $ref: '#/definitions/models.VisitType'
        enum:
        - baru
        - kontrol
        example: kontrol
    required:
    - chief_complaint
    - doctor_id
    - patient_id
    - penjamin
    - poli_id
    - visit_type
    type: object
  apm.SessionBrief:
    properties:
      doctor_id:
        example: 9d1f6c2a-7b3e-4a58-8c1d-0e5f4b2a6d93
        type: string
      end_time:
        example: "12:00"
        type: string
      remaining:
        example: 7
        type: integer
      replaced_doctor_name:
        description: ReplacedDoctorName is the doctor this one replaces today (leave
          or no session); null otherwise.
        example: dr. Maya Putri, Sp.PD
        type: string
      start_time:
        example: "08:00"
        type: string
      status:
        enum:
        - active
        - substitute
        - leave
        example: active
        type: string
      total_quota:
        example: 30
        type: integer
    type: object
  apm.Ticket:
    properties:
      doctor:
        $ref: '#/definitions/apm.DoctorBrief'
      medical_record_number:
        example: RM-000001
        type: string
      patient_name:
        example: Siti Rahmawati
        type: string
      penjamin:
        allOf:
        - $ref: '#/definitions/models.Penjamin'
        enum:
        - umum
        - bpjs
        - asuransi
        example: bpjs
      poli:
        $ref: '#/definitions/apm.PoliBrief'
      poli_queue_number:
        description: queue inside the clinic
        example: "003"
        type: string
      printed_at:
        type: string
      queue_number:
        description: registration desk queue, called at the counters
        example: A007
        type: string
      visit_date:
        example: "2026-10-16"
        type: string
      visit_id:
        example: 104dd35e-2b3a-4b2a-b38c-8bdd0e1ecc79
        type: string
    type: object
  auth.LoginRequest:
    properties:
      identifier:
        description: NIP or email
        example: superadmin@simrs.com
        type: string
      password:
        example: superadmin
        type: string
    required:
    - identifier
    - password
    type: object
  auth.LoginResponse:
    properties:
      access_token:
        type: string
      expires_in:
        description: seconds
        example: 28800
        type: integer
      token_type:
        example: Bearer
        type: string
      user:
        $ref: '#/definitions/auth.UserResponse'
    type: object
  auth.RegisterRequest:
    properties:
      doctor_id:
        example: 9d1f6c2a-7b3e-4a58-8c1d-0e5f4b2a6d93
        type: string
      email:
        example: superadmin@simrs.com
        maxLength: 150
        type: string
      name:
        example: Super Admin
        maxLength: 150
        type: string
      nip:
        example: "1000000001"
        maxLength: 30
        type: string
      password:
        example: superadmin
        maxLength: 72
        minLength: 8
        type: string
      role:
        example: superadmin
        type: string
    required:
    - email
    - name
    - nip
    - password
    type: object
  auth.UserResponse:
    properties:
      created_at:
        type: string
      doctor_id:
        description: Present only for doctor accounts.
        example: 9d1f6c2a-7b3e-4a58-8c1d-0e5f4b2a6d93
        type: string
      email:
        example: superadmin@simrs.com
        type: string
      id:
        example: 3f2b8c1e-5d4a-4e7b-9a1c-2b6f0d8e4a71
        type: string
      is_active:
        example: true
        type: boolean
      name:
        example: Super Admin
        type: string
      nip:
        example: "1000000001"
        type: string
      role:
        example: superadmin
        type: string
    type: object
  cashier.BillResponse:
    properties:
      coverage_limit:
        example: 0
        type: integer
      discount_reason:
        type: string
      excess:
        example: 0
        type: integer
      finalized_at:
        type: string
      invoice_number:
        example: INV/20261016/0001
        type: string
      items:
        items:
          $ref: '#/definitions/cashier.ItemResponse'
        type: array
      paid_at:
        type: string
      payments:
        items:
          $ref: '#/definitions/cashier.PaymentResponse'
        type: array
      receipt_number:
        example: KW/20261016/0001
        type: string
      scheme:
        example: umum
        type: string
      status:
        example: draft
        type: string
      tariff_effective_date:
        example: "2026-01-01"
        type: string
      tariff_version:
        example: 1
        type: integer
      totals:
        $ref: '#/definitions/cashier.TotalsResponse'
      visit:
        $ref: '#/definitions/cashier.VisitResponse'
    type: object
  cashier.CashierRef:
    properties:
      id:
        type: string
      name:
        example: Rina
        type: string
    type: object
  cashier.CloseShiftRequest:
    properties:
      counted_cash:
        example: 350000
        minimum: 0
        type: integer
      note:
        example: All receipts match.
        maxLength: 500
        type: string
    required:
    - counted_cash
    type: object
  cashier.DiscountRequest:
    properties:
      amount:
        example: 25000
        minimum: 0
        type: integer
      reason:
        example: Patient is a hospital employee family member
        maxLength: 500
        type: string
    type: object
  cashier.DoctorRef:
    properties:
      id:
        type: string
      name:
        example: dr. Andi
        type: string
      specialization:
        example: Umum
        type: string
    type: object
  cashier.ItemRequest:
    properties:
      name:
        example: Wound dressing kit
        maxLength: 150
        type: string
      price:
        example: 45000
        minimum: 1
        type: integer
      quantity:
        example: 1
        maximum: 1000
        minimum: 1
        type: integer
      reason:
        example: Used during the doctor's procedure
        maxLength: 500
        type: string
    required:
    - name
    - price
    - quantity
    - reason
    type: object
  cashier.ItemResponse:
    properties:
      category:
        example: administration
        type: string
      created_by:
        type: string
      id:
        type: string
      is_manual:
        type: boolean
      name:
        example: Karcis rawat jalan
        type: string
      price:
        example: 30000
        type: integer
      quantity:
        example: 1
        type: integer
      reason:
        type: string
      served_at:
        type: string
      source:
        example: registration
        type: string
      subtotal:
        example: 30000
        type: integer
    type: object
  cashier.PatientRef:
    properties:
      allergies:
        type: string
      birth_date:
        example: "1990-01-01"
        type: string
      full_name:
        example: Budi Santoso
        type: string
      gender:
        example: Male
        type: string
      id:
        type: string
      medical_record_number:
        example: RM-000123
        type: string
      nik:
        example: "3273010101900001"
        type: string
    type: object
  cashier.PaymentPart:
    properties:
      amount:
        example: 105000
        minimum: 0
        type: integer
      method:
        enum:
        - cash
        - qris
        - va
        example: cash
        type: string
      received:
        description: Received is the cash handed over, for cash only; the change is
          computed from it.
        example: 110000
        minimum: 0
        type: integer
      reference:
        example: QR-INV/20261016/0001
        maxLength: 50
        type: string
    required:
    - method
    type: object
  cashier.PaymentRequest:
    properties:
      payments:
        items:
          $ref: '#/definitions/cashier.PaymentPart'
        maxItems: 3
        type: array
    type: object
  cashier.PaymentResponse:
    properties:
      amount:
        example: 105000
        type: integer
      cashier:
        example: Rina
        type: string
      change:
        example: 5000
        type: integer
      id:
        type: string
      method:
        example: cash
        type: string
      paid_at:
        type: string
      received:
        example: 110000
        type: integer
      reference:
        type: string
      shift_id:
        type: string
    type: object
  cashier.PoliRef:
    properties:
      id:
        type: string
      name:
        example: General Clinic
        type: string
      prefix_code:
        example: UMUM
        type: string
    type: object
  cashier.PrintRequest:
    properties:
      kind:
        enum:
        - print
        - pdf
        example: print
        type: string
    required:
    - kind
    type: object
  cashier.SchemeRequest:
    properties:
      coverage_limit:
        example: 500000
        minimum: 0
        type: integer
      excess:
        example: 0
        minimum: 0
        type: integer
      scheme:
        enum:
        - umum
        - bpjs
        - asuransi
        example: asuransi
        type: string
    required:
    - scheme
    type: object
  cashier.ShiftResponse:
    properties:
      cash_difference:
        type: integer
      cashier:
        $ref: '#/definitions/cashier.CashierRef'
      closed_at:
        type: string
      counted_cash:
        type: integer
      id:
        type: string
      is_open:
        example: true
        type: boolean
      note:
        type: string
      opened_at:
        type: string
      summary:
        $ref: '#/definitions/cashier.ShiftSummaryResponse'
      total:
        type: integer
    type: object
  cashier.ShiftSummaryResponse:
    properties:
      cash:
        example: 350000
        type: integer
      cash_count:
        example: 3
        type: integer
      qris:
        example: 120000
        type: integer
      qris_count:
        example: 1
        type: integer
      total:
        example: 470000
        type: integer
      transactions:
        example: 4
        type: integer
      va:
        example: 0
        type: integer
      va_count:
        example: 0
        type: integer
    type: object
  cashier.SummaryResponse:
    properties:
      finalized_at:
        type: string
      invoice_number:
        example: INV/20261016/0001
        type: string
      paid_at:
        type: string
      receipt_number:
        example: KW/20261016/0001
        type: string
      scheme:
        example: umum
        type: string
      status:
        example: draft
        type: string
      totals:
        $ref: '#/definitions/cashier.TotalsResponse'
      visit:
        $ref: '#/definitions/cashier.VisitResponse'
    type: object
  cashier.TotalsResponse:
    properties:
      discount:
        example: 0
        type: integer
      excess:
        example: 0
        type: integer
      net:
        example: 105000
        type: integer
      paid:
        example: 0
        type: integer
      patient_portion:
        example: 105000
        type: integer
      payer_covered:
        example: 0
        type: integer
      remaining:
        example: 105000
        type: integer
      subtotal:
        example: 105000
        type: integer
    type: object
  cashier.VisitResponse:
    properties:
      bpjs_card_number:
        type: string
      completed_at:
        type: string
      coverage_limit:
        type: integer
      doctor:
        $ref: '#/definitions/cashier.DoctorRef'
      id:
        type: string
      insurance_name:
        type: string
      patient:
        $ref: '#/definitions/cashier.PatientRef'
      penjamin:
        example: umum
        type: string
      poli:
        $ref: '#/definitions/cashier.PoliRef'
      policy_number:
        type: string
      queue_number:
        example: "001"
        type: string
      registered_at:
        type: string
      visit_date:
        example: "2026-10-16"
        type: string
      visit_status:
        example: Completed
        type: string
    type: object
  doctors.DoctorRequest:
    properties:
      ihs_number:
        example: "10009880728"
        maxLength: 20
        minLength: 5
        type: string
      is_active:
        example: true
        type: boolean
      name:
        example: dr. Andi Wijaya, Sp.PD
        maxLength: 150
        minLength: 3
        type: string
      poli_id:
        example: 3f2b8c1e-5d4a-4e7b-9a1c-2b6f0d8e4a71
        type: string
      sip_number:
        example: 446/001/SIP-D/2026
        maxLength: 50
        minLength: 5
        type: string
      specialization:
        example: Internal Medicine
        maxLength: 100
        type: string
      str_number:
        example: "3111100220123456"
        maxLength: 50
        minLength: 5
        type: string
    required:
    - name
    - poli_id
    - sip_number
    - specialization
    - str_number
    type: object
  doctors.PoliRef:
    properties:
      id:
        example: 3f2b8c1e-5d4a-4e7b-9a1c-2b6f0d8e4a71
        type: string
      name:
        example: General Clinic
        type: string
      prefix_code:
        example: UMUM
        type: string
      room:
        example: Room 101
        type: string
    type: object
  doctors.Response:
    properties:
      created_at:
        type: string
      id:
        example: 9d1f6c2a-7b3e-4a58-8c1d-0e5f4b2a6d93
        type: string
      ihs_number:
        example: "10009880728"
        type: string
      is_active:
        example: true
        type: boolean
      name:
        example: dr. Andi Wijaya, Sp.PD
        type: string
      poli:
        $ref: '#/definitions/doctors.PoliRef'
      sip_number:
        example: 446/001/SIP-D/2026
        type: string
      specialization:
        example: Internal Medicine
        type: string
      str_number:
        example: "3111100220123456"
        type: string
      updated_at:
        type: string
    type: object
  examinations.AddendumRequest:
    properties:
      content:
        example: 'Correction: allergy to amoxicillin was confirmed.'
        maxLength: 5000
        type: string
    required:
    - content
    type: object
  examinations.AddendumResponse:
    properties:
      author_user_id:
        example: 5b815a95-e4d9-40c1-bfc0-dccbe1f38722
        type: string
      content:
        type: string
      created_at:
        type: string
      id:
        example: 7d1f6c2a-7b3e-4a58-8c1d-0e5f4b2a6d93
        type: string
    type: object
  examinations.Assessment:
    properties:
      notes:
        type: string
      primary_diagnosis:
        $ref: '#/definitions/examinations.DiagnosisResponse'
      secondary_diagnoses:
        items:
          $ref: '#/definitions/examinations.DiagnosisResponse'
        type: array
    type: object
  examinations.AttachmentSummary:
    properties:
      content_type:
        example: application/pdf
        type: string
      created_at:
        type: string
      file_name:
        example: control-notes.pdf
        type: string
      id:
        example: 2c1f6c2a-7b3e-4a58-8c1d-0e5f4b2a6d93
        type: string
      size_bytes:
        example: 253952
        type: integer
    type: object
  examinations.CloseRequest:
    properties:
      discharge_condition:
        enum:
        - recovered
        - improved
        - unchanged
        example: improved
        type: string
      discharge_method:
        enum:
        - home
        - follow_up
        - referred
        - inpatient
        example: follow_up
        type: string
    required:
    - discharge_condition
    - discharge_method
    type: object
  examinations.DiagnosisInput:
    properties:
      icd10_code:
        example: J06.9
        type: string
      name:
        example: Acute upper respiratory infection, unspecified
        maxLength: 255
        type: string
    required:
    - icd10_code
    type: object
  examinations.DiagnosisResponse:
    properties:
      icd10_code:
        example: J06.9
        type: string
      name:
        example: Acute upper respiratory infection, unspecified
        type: string
    type: object
  examinations.ExaminationResponse:
    properties:
      prefill:
        $ref: '#/definitions/examinations.Prefill'
      soap_note:
        $ref: '#/definitions/examinations.SoapResponse'
      visit:
        $ref: '#/definitions/examinations.VisitSummary'
      vital_signs:
        $ref: '#/definitions/examinations.VitalResponse'
    type: object
  examinations.Flag:
    properties:
      field:
        example: spo2
        type: string
      level:
        enum:
        - warning
        - critical
        example: warning
        type: string
      message:
        example: SpO2 below 95%
        type: string
    type: object
  examinations.HistoryItem:
    properties:
      attachments:
        items:
          $ref: '#/definitions/examinations.AttachmentSummary'
        type: array
      soap_note:
        $ref: '#/definitions/examinations.SoapResponse'
      visit:
        $ref: '#/definitions/examinations.VisitSummary'
    type: object
  examinations.Objective:
    properties:
      findings:
        type: string
      vital_signs:
        $ref: '#/definitions/examinations.VitalResponse'
    type: object
  examinations.PatientSummary:
    properties:
      age:
        example: 36
        type: integer
      allergies:
        example: Penicillin
        type: string
      birth_date:
        example: "1990-05-17"
        type: string
      full_name:
        example: Siti Rahmawati
        type: string
      gender:
        allOf:
        - $ref: '#/definitions/models.Gender'
        enum:
        - Male
        - Female
        example: Female
      id:
        example: 3f2b8c1e-5d4a-4e7b-9a1c-2b6f0d8e4a71
        type: string
      medical_record_number:
        example: RM-000001
        type: string
      nik:
        example: "3273010101900001"
        type: string
    type: object
  examinations.Prefill:
    properties:
      allergies:
        example: Penicillin
        type: string
      chief_complaint:
        example: Fever and cough for three days
        type: string
    type: object
  examinations.SoapRequest:
    properties:
      assessment_notes:
        example: URTI, good general condition.
        maxLength: 5000
        type: string
      control_date:
        description: only with outpatient_followup
        example: "2026-10-22"
        type: string
      follow_up:
        enum:
        - discharge
        - outpatient_followup
        - refer_inpatient
        - refer_icu
        example: outpatient_followup
        type: string
      objective_findings:
        example: Pharynx hyperemic, no rhonchi, no wheezing.
        maxLength: 5000
        type: string
      plan:
        example: Paracetamol 3x500 mg, drink plenty of fluids, rest.
        maxLength: 5000
        type: string
      primary_diagnosis:
        $ref: '#/definitions/examinations.DiagnosisInput'
      referral_notes:
        description: only with refer_inpatient / refer_icu
        example: ""
        maxLength: 1000
        type: string
      secondary_diagnoses:
        items:
          $ref: '#/definitions/examinations.DiagnosisInput'
        maxItems: 10
        type: array
      subjective:
        example: Fever for 3 days, productive cough, no shortness of breath.
        maxLength: 5000
        type: string
      version:
        example: 0
        minimum: 0
        type: integer
    type: object
  examinations.SoapResponse:
    properties:
      addenda:
        items:
          $ref: '#/definitions/examinations.AddendumResponse'
        type: array
      assessment:
        $ref: '#/definitions/examinations.Assessment'
      control_date:
        example: "2026-10-22"
        type: string
      doctor_id:
        example: 9d1f6c2a-7b3e-4a58-8c1d-0e5f4b2a6d93
        type: string
      finalized_at:
        type: string
      follow_up:
        example: outpatient_followup
        type: string
      objective:
        $ref: '#/definitions/examinations.Objective'
      plan:
        type: string
      referral_notes:
        type: string
      status:
        enum:
        - draft
        - final
        example: draft
        type: string
      subjective:
        type: string
      updated_at:
        type: string
      version:
        example: 0
        type: integer
      visit_id:
        example: 104dd35e-2b3a-4b2a-b38c-8bdd0e1ecc79
        type: string
    type: object
  examinations.VersionDetail:
