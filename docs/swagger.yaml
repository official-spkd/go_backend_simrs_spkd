            $ref: '#/definitions/utils.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List visits
      tags:
      - visits
    post:
      consumes:
      - application/json
      description: Front Office only. The patient (patient_id), poli (poli_id) and
        an active doctor (doctor_id) must already exist, and the doctor must work
        in that poli. Names are looked up from polis and doctors, never stored on
        the visit. Queue numbers restart at 001 for each clinic and date. BPJS fields
        are required when penjamin is bpjs and insurance fields when it is asuransi;
        they are rejected for any other penjamin.
