        weekly schedule and leaves (nothing is stored). Defaults to the next 30 days
        from today; a period can span at most 31 days. A leave gives a "leave" row
        with zero quota, plus a "substitute" row when another doctor takes over; the
        substitute row counts the visits of both doctors. filled is the number of
        non-cancelled visits, so every registration channel shares one quota.
