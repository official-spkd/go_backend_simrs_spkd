    - Completed
    - Paid
    - Cancelled
    type: string
    x-enum-varnames:
    - VisitRegistered
    - VisitServed
    - VisitCompleted
    - VisitPaid
    - VisitCancelled
  models.VisitType:
    enum:
    - baru
    - kontrol
    type: string
    x-enum-varnames:
    - VisitTypeNew
    - VisitTypeFollowUp
  patients.PatientRequest:
    properties:
      allergies:
        example: Penicillin, peanuts
        maxLength: 1000
        type: string
      birth_date:
        example: "1990-05-17"
        type: string
      birth_place:
        example: Jakarta
        maxLength: 100
        type: string
      blood_type:
