  /api/v1/visits:
    get:
      description: Front Office only. Newest dates first, then by clinic and queue
        number.
      parameters:
      - description: Search by patient name, NIK or medical record number
        in: query
        name: search
        type: string
      - description: Visit date (YYYY-MM-DD)
        in: query
        name: date
        type: string
      - description: Only visits of this poli
        in: query
        name: poli_id
        type: string
      - description: Only visits of this doctor
        in: query
        name: doctor_id
        type: string
      - description: Penjamin
        enum:
        - umum
        - bpjs
        - asuransi
        in: query
        name: penjamin
        type: string
      - description: Visit type
        enum:
        - baru
        - kontrol
        in: query
        name: visit_type
        type: string
      - description: Visit status
        enum:
        - Registered
        - Served
        - Completed
        - Paid
        - Cancelled
        in: query
        name: visit_status
        type: string
      - description: Clinic queue status
        enum:
        - Waiting
        - Called
        - Skipped
        - Done
        in: query
        name: queue_status
        type: string
      - description: Satu Sehat status
        enum:
        - NotSent
        - Sent
        in: query
        name: satu_sehat_status
        type: string
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 20
        description: Items per page (max 100)
        in: query
        name: limit
        type: integer
