basePath: /
definitions:
  auth.LoginRequest:
    properties:
      identifier:
        description: NIP or email
        example: superadmin@simrs.com
        type: string
      password:
        example: superadmin
        type: string
    required:
    - identifier
    - password
    type: object
  auth.LoginResponse:
    properties:
      access_token:
        type: string
      expires_in:
        description: seconds
        example: 28800
        type: integer
      token_type:
        example: Bearer
        type: string
      user:
        $ref: '#/definitions/auth.UserResponse'
    type: object
  auth.RegisterRequest:
    properties:
      doctor_id:
        example: 9d1f6c2a-7b3e-4a58-8c1d-0e5f4b2a6d93
        type: string
      email:
        example: superadmin@simrs.com
        maxLength: 150
        type: string
      name:
        example: Super Admin
        maxLength: 150
        type: string
      nip:
        example: "1000000001"
        maxLength: 30
        type: string
      password:
        example: superadmin
        maxLength: 72
        minLength: 8
        type: string
      role:
        example: superadmin
        type: string
    required:
    - email
    - name
    - nip
    - password
    type: object
  auth.UserResponse:
    properties:
      created_at:
        type: string
      doctor_id:
        description: Present only for doctor accounts.
        example: 9d1f6c2a-7b3e-4a58-8c1d-0e5f4b2a6d93
        type: string
      email:
        example: superadmin@simrs.com
        type: string
      id:
        example: 3f2b8c1e-5d4a-4e7b-9a1c-2b6f0d8e4a71
        type: string
      is_active:
        example: true
        type: boolean
      name:
        example: Super Admin
        type: string
      nip:
        example: "1000000001"
        type: string
      role:
        example: superadmin
        type: string
    type: object
  doctors.DoctorRequest:
    properties:
      ihs_number:
        example: "10009880728"
        maxLength: 20
        minLength: 5
        type: string
      is_active:
        example: true
        type: boolean
      name:
        example: dr. Andi Wijaya, Sp.PD
        maxLength: 150
        minLength: 3
        type: string
      poli_id:
        example: 3f2b8c1e-5d4a-4e7b-9a1c-2b6f0d8e4a71
        type: string
      sip_number:
        example: 446/001/SIP-D/2026
        maxLength: 50
        minLength: 5
        type: string
      specialization:
        example: Internal Medicine
        maxLength: 100
        type: string
      str_number:
        example: "3111100220123456"
        maxLength: 50
        minLength: 5
        type: string
    required:
    - name
    - poli_id
    - sip_number
    - specialization
    - str_number
    type: object
  doctors.PoliRef:
    properties:
      id:
        example: 3f2b8c1e-5d4a-4e7b-9a1c-2b6f0d8e4a71
        type: string
      name:
        example: General Clinic
        type: string
      prefix_code:
        example: UMUM
        type: string
      room:
        example: Room 101
        type: string
    type: object
  doctors.Response:
    properties:
      created_at:
        type: string
      id:
        example: 9d1f6c2a-7b3e-4a58-8c1d-0e5f4b2a6d93
        type: string
      ihs_number:
        example: "10009880728"
        type: string
      is_active:
        example: true
        type: boolean
      name:
        example: dr. Andi Wijaya, Sp.PD
        type: string
      poli:
        $ref: '#/definitions/doctors.PoliRef'
      sip_number:
        example: 446/001/SIP-D/2026
        type: string
      specialization:
        example: Internal Medicine
        type: string
      str_number:
        example: "3111100220123456"
        type: string
      updated_at:
        type: string
    type: object
  examinations.AddendumRequest:
    properties:
      content:
        example: 'Correction: allergy to amoxicillin was confirmed.'
        maxLength: 5000
        type: string
    required:
    - content
    type: object
  examinations.AddendumResponse:
    properties:
      author_user_id:
        example: 5b815a95-e4d9-40c1-bfc0-dccbe1f38722
        type: string
      content:
        type: string
      created_at:
        type: string
      id:
        example: 7d1f6c2a-7b3e-4a58-8c1d-0e5f4b2a6d93
        type: string
    type: object
  examinations.Assessment:
    properties:
      notes:
        type: string
      primary_diagnosis:
        $ref: '#/definitions/examinations.DiagnosisResponse'
      secondary_diagnoses:
        items:
          $ref: '#/definitions/examinations.DiagnosisResponse'
        type: array
    type: object
  examinations.DiagnosisInput:
    properties:
      icd10_code:
        example: J06.9
        type: string
      name:
        example: Acute upper respiratory infection, unspecified
        maxLength: 255
        type: string
    required:
    - icd10_code
    type: object
  examinations.DiagnosisResponse:
    properties:
      icd10_code:
        example: J06.9
        type: string
      name:
        example: Acute upper respiratory infection, unspecified
        type: string
    type: object
  examinations.ExaminationResponse:
    properties:
      prefill:
        $ref: '#/definitions/examinations.Prefill'
      soap_note:
        $ref: '#/definitions/examinations.SoapResponse'
      visit:
        $ref: '#/definitions/examinations.VisitSummary'
      vital_signs:
        $ref: '#/definitions/examinations.VitalResponse'
    type: object
  examinations.Flag:
    properties:
      field:
        example: spo2
        type: string
      level:
        enum:
        - warning
        - critical
        example: warning
        type: string
      message:
        example: SpO2 below 95%
        type: string
    type: object
  examinations.Objective:
    properties:
      findings:
        type: string
      vital_signs:
        $ref: '#/definitions/examinations.VitalResponse'
    type: object
  examinations.PatientSummary:
    properties:
      age:
        example: 36
        type: integer
      birth_date:
        example: "1990-05-17"
        type: string
      full_name:
        example: Siti Rahmawati
        type: string
      gender:
        allOf:
        - $ref: '#/definitions/models.Gender'
        enum:
        - Male
        - Female
        example: Female
      id:
        example: 3f2b8c1e-5d4a-4e7b-9a1c-2b6f0d8e4a71
        type: string
      medical_record_number:
        example: RM-000001
        type: string
    type: object
  examinations.Prefill:
    properties:
      allergies:
        example: Penicillin
        type: string
      chief_complaint:
        example: Fever and cough for three days
        type: string
    type: object
  examinations.SoapRequest:
    properties:
      assessment_notes:
        example: URTI, good general condition.
        maxLength: 5000
        type: string
      control_date:
        description: only with outpatient_followup
        example: "2026-10-22"
        type: string
      follow_up:
        enum:
        - discharge
        - outpatient_followup
        - refer_inpatient
        - refer_icu
        example: outpatient_followup
        type: string
      objective_findings:
        example: Pharynx hyperemic, no rhonchi, no wheezing.
        maxLength: 5000
        type: string
      plan:
        example: Paracetamol 3x500 mg, drink plenty of fluids, rest.
        maxLength: 5000
        type: string
      primary_diagnosis:
        $ref: '#/definitions/examinations.DiagnosisInput'
      referral_notes:
        description: only with refer_inpatient / refer_icu
        example: ""
        maxLength: 1000
        type: string
      secondary_diagnoses:
        items:
          $ref: '#/definitions/examinations.DiagnosisInput'
        maxItems: 10
        type: array
      subjective:
        example: Fever for 3 days, productive cough, no shortness of breath.
        maxLength: 5000
        type: string
      version:
        example: 0
        minimum: 0
        type: integer
    type: object
  examinations.SoapResponse:
    properties:
      addenda:
        items:
          $ref: '#/definitions/examinations.AddendumResponse'
        type: array
      assessment:
        $ref: '#/definitions/examinations.Assessment'
      control_date:
        example: "2026-10-22"
        type: string
      doctor_id:
        example: 9d1f6c2a-7b3e-4a58-8c1d-0e5f4b2a6d93
        type: string
      finalized_at:
        type: string
      follow_up:
        example: outpatient_followup
        type: string
      objective:
        $ref: '#/definitions/examinations.Objective'
      plan:
        type: string
      referral_notes:
        type: string
      status:
        enum:
        - draft
        - final
        example: draft
        type: string
      subjective:
        type: string
      updated_at:
        type: string
      version:
        example: 0
        type: integer
      visit_id:
        example: 104dd35e-2b3a-4b2a-b38c-8bdd0e1ecc79
        type: string
    type: object
  examinations.VisitSummary:
    properties:
      doctor:
        example: dr. Andi Wijaya
        type: string
      id:
        example: 104dd35e-2b3a-4b2a-b38c-8bdd0e1ecc79
        type: string
      patient:
        $ref: '#/definitions/examinations.PatientSummary'
      poli:
        example: General Clinic
        type: string
      visit_date:
        example: "2026-10-15"
        type: string
      visit_status:
        allOf:
        - $ref: '#/definitions/models.VisitStatus'
        enum:
        - Registered
        - Served
        - Completed
        - Paid
        - Cancelled
        example: Served
      visit_type:
        allOf:
        - $ref: '#/definitions/models.VisitType'
        enum:
        - baru
        - kontrol
        example: baru
    type: object
  examinations.VitalRequest:
    properties:
      allergies:
        description: Either list the allergies or confirm there are none; an empty
          text alone is not an answer.
        example: Penicillin, shrimp
        maxLength: 1000
        type: string
      chief_complaint:
        example: Fever and cough for three days
        maxLength: 1000
        type: string
      consciousness:
        enum:
        - compos_mentis
        - apathy
        - delirium
        - somnolence
        - stupor
        - coma
        example: compos_mentis
        type: string
      diastolic_bp:
        example: 80
        maximum: 200
        minimum: 20
        type: integer
      fall_risk:
        example: true
        type: boolean
      fall_risk_level:
        description: required when fall_risk is true
        enum:
        - low
        - moderate
        - high
        example: low
        type: string
      height_cm:
        description: Height and weight go together; they are required for a first
          visit (visit_type baru).
        example: 165
        maximum: 250
        minimum: 30
        type: number
      no_known_allergies:
        example: false
        type: boolean
      pain_score:
        example: 2
        maximum: 10
        minimum: 0
        type: integer
      pulse:
        example: 82
        maximum: 250
        minimum: 20
        type: integer
      respiratory_rate:
        example: 18
        maximum: 80
        minimum: 4
        type: integer
      spo2:
        example: 98
        maximum: 100
        minimum: 50
        type: integer
      systolic_bp:
        example: 120
        maximum: 300
        minimum: 40
        type: integer
      temperature:
        example: 36.8
        maximum: 45
        minimum: 30
        type: number
      version:
        example: 0
        minimum: 0
        type: integer
      weight_kg:
        example: 60
        maximum: 400
        minimum: 0.5
        type: number
    required:
    - chief_complaint
    - consciousness
    - diastolic_bp
    - fall_risk
    - pain_score
    - pulse
    - respiratory_rate
    - spo2
    - systolic_bp
    - temperature
    type: object
  examinations.VitalResponse:
    properties:
      allergies:
        example: Penicillin, shrimp
        type: string
      bmi:
        example: 22
        type: number
      bmi_category:
        enum:
        - severely_underweight
        - underweight
        - normal
        - overweight
        - obese
        - not_applicable
        example: normal
        type: string
      chief_complaint:
        example: Fever and cough for three days
        type: string
      consciousness:
        example: compos_mentis
        type: string
      diastolic_bp:
        example: 80
        type: integer
      fall_risk:
        example: true
        type: boolean
      fall_risk_level:
        example: low
        type: string
      flags:
        items:
          $ref: '#/definitions/examinations.Flag'
        type: array
      height_cm:
        example: 165
        type: number
      measured_at:
        type: string
      measured_by_user_id:
        example: 5b815a95-e4d9-40c1-bfc0-dccbe1f38722
        type: string
      no_known_allergies:
        example: false
        type: boolean
      pain_category:
        enum:
        - none
        - mild
        - moderate
        - severe
        example: mild
        type: string
      pain_score:
        example: 2
        type: integer
      pulse:
        example: 82
        type: integer
      respiratory_rate:
        example: 18
        type: integer
      spo2:
        example: 98
        type: integer
      systolic_bp:
        example: 120
        type: integer
      temperature:
        example: 36.8
        type: number
      updated_at:
        type: string
      version:
        example: 0
        type: integer
      visit_id:
        example: 104dd35e-2b3a-4b2a-b38c-8bdd0e1ecc79
        type: string
      weight_kg:
        example: 60
        type: number
    type: object
  models.Gender:
    enum:
    - Male
    - Female
    type: string
    x-enum-varnames:
    - GenderMale
    - GenderFemale
  models.Payer:
    enum:
    - General
    - BPJS
    - Insurance
    type: string
    x-enum-varnames:
    - PayerGeneral
    - PayerBPJS
    - PayerInsurance
  models.Penjamin:
    enum:
    - umum
    - bpjs
    - asuransi
    type: string
    x-enum-varnames:
    - PenjaminUmum
    - PenjaminBPJS
    - PenjaminAsuransi
  models.QueueStatus:
    enum:
    - Waiting
    - Called
    - Skipped
    - Done
    type: string
    x-enum-varnames:
    - QueueWaiting
    - QueueCalled
    - QueueSkipped
    - QueueDone
  models.SatuSehatStatus:
