  /api/v1/queues:
    get:
      description: Front Office and doctors. Queues of one date (default today) in
        call order. A signed-in doctor always gets only their own patients, taken
        from the session (the doctor linked to their account); doctor_id is ignored
        for doctors and an account without a linked doctor gets 403. Front Office
        may filter by doctor_id.
      parameters:
      - description: Queue date (YYYY-MM-DD), default today
        in: query
        name: date
        type: string
      - description: Queue status
        enum:
        - WAITING
        - CALLING
        - SERVING
        - COMPLETED
        - SKIPPED
        in: query
        name: status
        type: string
      - description: Counter ID
        in: query
        name: counter_id
        type: string
      - description: Only this doctor's patients (Front Office; ignored for doctors)
        in: query
        name: doctor_id
        type: string
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 20
        description: Items per page (max 100)
