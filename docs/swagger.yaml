basePath: /
definitions:
  auth.LoginRequest:
    properties:
      identifier:
        description: NIP or email
        example: "198001012010011001"
        type: string
      password:
        example: s3cretPass!
        type: string
    required:
    - identifier
    - password
    type: object
  auth.LoginResponse:
    properties:
      access_token:
        type: string
      expires_in:
        description: seconds
        example: 28800
        type: integer
      token_type:
        example: Bearer
        type: string
      user:
        $ref: '#/definitions/auth.UserResponse'
    type: object
  auth.RegisterRequest:
    properties:
      email:
        example: jane.doe@hospital.id
        maxLength: 150
        type: string
      name:
        example: Dr. Jane Doe
        maxLength: 150
        type: string
      nip:
        example: "198001012010011001"
        maxLength: 30
        type: string
      password:
        example: s3cretPass!
        maxLength: 72
        minLength: 8
        type: string
      role:
        example: doctor
        type: string
    required:
    - email
    - name
    - nip
    - password
    type: object
  auth.UserResponse:
    properties:
      created_at:
        type: string
      email:
        example: jane.doe@hospital.id
        type: string
      id:
        example: 3f2b8c1e-5d4a-4e7b-9a1c-2b6f0d8e4a71
        type: string
      is_active:
        example: true
        type: boolean
      name:
        example: Dr. Jane Doe
        type: string
      nip:
        example: "198001012010011001"
        type: string
      role:
        example: doctor
        type: string
    type: object
  roles.CreateRequest:
    properties:
      description:
        example: Ward nurse
        maxLength: 255
        type: string
      display_name:
        example: Nurse
        maxLength: 100
        type: string
      name:
        example: nurse
        maxLength: 50
        minLength: 2
        type: string
    required:
    - display_name
    - name
    type: object
  roles.Role:
    properties:
      created_at:
        type: string
      description:
        example: Medical doctor
        type: string
      display_name:
        example: Doctor
        type: string
      id:
        example: 3f2b8c1e-5d4a-4e7b-9a1c-2b6f0d8e4a71
        format: uuid
        type: string
      is_system:
        description: built-in roles cannot be deleted
        example: true
        type: boolean
      name:
        example: doctor
        type: string
      updated_at:
        type: string
    type: object
  roles.UpdateRequest:
    properties:
      description:
        example: Ward head nurse
        maxLength: 255
        type: string
      display_name:
        example: Head Nurse
        maxLength: 100
        type: string
    required:
    - display_name
    type: object
  utils.ErrorBody:
    properties:
      error:
        example: something went wrong
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: API documentation for SIMRS.
  title: SIMRS API
  version: "1.0"
paths:
  /api/v1/auth/login:
    post:
      consumes:
      - application/json
      parameters:
      - description: Credentials
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.LoginResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.ErrorBody'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.ErrorBody'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/utils.ErrorBody'
      summary: Sign in with NIP or email
      tags:
      - auth
  /api/v1/auth/me:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.UserResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.ErrorBody'
      security:
      - BearerAuth: []
      summary: Get the signed-in user
      tags:
      - auth
  /api/v1/auth/register:
    post:
      consumes:
      - application/json
      description: Open for the very first account (becomes superadmin). Afterwards
        only a superadmin can register accounts.
      parameters:
      - description: User data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/auth.UserResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.ErrorBody'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.ErrorBody'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/utils.ErrorBody'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/utils.ErrorBody'
      security:
      - BearerAuth: []
      summary: Register a user
      tags:
      - auth
  /api/v1/roles:
    get:
      description: Superadmin only.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/roles.Role'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.ErrorBody'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/utils.ErrorBody'
      security:
      - BearerAuth: []
      summary: List roles
      tags:
      - roles
    post:
      consumes:
      - application/json
      description: Superadmin only.
      parameters:
      - description: Role data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/roles.CreateRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/roles.Role'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.ErrorBody'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.ErrorBody'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/utils.ErrorBody'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/utils.ErrorBody'
      security:
      - BearerAuth: []
      summary: Create a role
      tags:
      - roles
  /api/v1/roles/{id}:
    delete:
      description: Superadmin only.
      parameters:
      - description: Role ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.ErrorBody'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.ErrorBody'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/utils.ErrorBody'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/utils.ErrorBody'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/utils.ErrorBody'
      security:
      - BearerAuth: []
      summary: Delete a role
      tags:
      - roles
    get:
      description: Superadmin only.
      parameters:
      - description: Role ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/roles.Role'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.ErrorBody'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.ErrorBody'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/utils.ErrorBody'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/utils.ErrorBody'
      security:
      - BearerAuth: []
      summary: Get a role
      tags:
      - roles
    put:
      consumes:
      - application/json
      description: Superadmin only.
      parameters:
      - description: Role ID
        in: path
        name: id
        required: true
        type: string
      - description: Role data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/roles.UpdateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/roles.Role'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.ErrorBody'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.ErrorBody'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/utils.ErrorBody'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/utils.ErrorBody'
      security:
      - BearerAuth: []
      summary: Update a role's display name and description
      tags:
      - roles
  /ping:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Health check
      tags:
      - health
schemes:
- http
- https
securityDefinitions:
  BearerAuth:
    description: Enter "Bearer {token}" (the word Bearer, a space, then the access_token
      from /auth/login).
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
